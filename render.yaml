services:
  - type: web
    name: overthink-council
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/council/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
